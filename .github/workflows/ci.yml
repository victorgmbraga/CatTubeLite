name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New security advisories appear without any change here.
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up
        run: sh .github/scripts/setup-debian.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Package
        run: bash packaging/tarball.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cattube-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up
        run: sh .github/scripts/setup-debian.sh
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Audit
        run: cargo audit
