[workspace]
members = [".", "crates/cattube-core"]
resolver = "3"

[package]
name = "cattube"
version = "1.1.1"
edition = "2024"
license = "MIT"
description = "A native Linux YouTube app for TV screens and remotes"
repository = "https://github.com/victorgmbraga/CatTubeLite"

[[bin]]
name = "cattube"
path = "src/main.rs"

[features]
# OpenGL only by default: TV boxes draw with it, and the binary is about
# 31% smaller.
default = []
# The Vulkan/Metal renderer, for desktops that want it: --features wgpu.
wgpu = ["eframe/wgpu"]

[dependencies]
cattube-core = { path = "crates/cattube-core" }
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# YouTube's API in-process, over kept-alive connections (rustls: no system
# TLS library needed).
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }

unicode-segmentation = "1.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
