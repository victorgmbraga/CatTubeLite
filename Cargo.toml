[workspace]
members = [".", "crates/cattube-core"]
resolver = "3"

[package]
name = "cattube"
version = "1.0.4"
edition = "2024"
license = "MIT"
description = "A native Linux YouTube app for TV screens and remotes"
repository = "https://github.com/victorgmbraga/CatTubeLite"

[[bin]]
name = "cattube"
path = "src/main.rs"

[features]
default = ["wgpu"]
# The Vulkan/Metal renderer. TV boxes use OpenGL and leave it out (31% smaller).
wgpu = ["eframe/wgpu"]

[dependencies]
cattube-core = { path = "crates/cattube-core" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

arabic_reshaper = "0.4.2"
unicode-bidi = "0.3.18"
unicode-segmentation = "1.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
