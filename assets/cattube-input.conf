# Remote-friendly keys for CatTube's player (mpv). Loaded with
# --input-conf by CatTube, which also passes --no-input-default-bindings:
# mpv's own keys (volume, numbers, mouse wheel, stats, ...) do nothing,
# so the player only does what CatTube's controls offer. OK, the arrows
# and Back are taken over by the control bar script (cattube-osd.lua: OK shows the controls, OK again
# pauses, Left/Right and the seek media keys scrub while the bar is hidden,
# showing its own progress bar); the entries below are the fallback if
# that script fails to load.
#
#   Play/Pause, Next/Prev  media keys
#   Back (Esc / Backspace) stop (the position is reported to the server)
ENTER        cycle pause; show-text "${?pause==yes:Paused}${?pause==no:Playing}" 1200
KP_ENTER     cycle pause; show-text "${?pause==yes:Paused}${?pause==no:Playing}" 1200
SPACE        cycle pause; show-text "${?pause==yes:Paused}${?pause==no:Playing}" 1200
PLAYPAUSE    cycle pause; show-text "${?pause==yes:Paused}${?pause==no:Playing}" 1200
PLAY         set pause no
PAUSE        set pause yes
LEFT         seek -10; show-progress
RIGHT        seek 10; show-progress
UP           seek 60; show-progress
DOWN         seek -60; show-progress
REWIND       seek -30; show-progress
FORWARD      seek 30; show-progress
NEXT         seek 90; show-progress
PREV         seek -90; show-progress
ESC          quit
BS           quit
GO_BACK      quit
STOP         quit
